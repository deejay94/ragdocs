services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ragdocs-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ragdocs
      POSTGRES_PASSWORD: ragdocs
      POSTGRES_DB: ragdocs
    volumes:
      - ragdocs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragdocs -d ragdocs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ragdocs_pgdata:
